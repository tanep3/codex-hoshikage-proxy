# Install as $HOME/.config/codex-hoshikage-proxy/config.toml.
# CODEX_HOSHIKAGE_PROXY_CONFIG may override that path when needed.

[server]
host = "127.0.0.1"
port = 4040
default_cwd = "${HOME}/work"
# Maximum time without any Codex App Server event for one Turn.
# This is an inactivity timeout, not a total task duration.
turn_idle_timeout_seconds = 600
# Probe Codex for a stalled Turn after this much silence.
turn_stall_detection_seconds = 180
# Number of consecutive no-progress probes before reporting turn_stalled.
turn_stall_confirmation_count = 3
# SSE heartbeat interval while a Turn is active.
turn_heartbeat_seconds = 30

[codex]
command = "codex"
args = ["app-server", "--listen", "stdio://"]

[codex.sandbox]
# Codex filesystem policy used for each thread.
mode = "workspace-write"
# Additional writable roots. The requested cwd is already writable in
# workspace-write mode; list only existing paths that need separate access.
writable_roots = []
# Enable this only when local skills need outbound network access.
network_access = false

[codex.compatibility]
minimum_version = "0.147.0"
tested_version = "0.147.0"

[security]
allowed_cwds = [
    "${HOME}/work",
    "${HOME}/projects",
]

[approval]
# Approval timeout in seconds. Use a short value only for testing.
timeout_seconds = 300
# Automatically approve operations Codex reports inside the requested workspace.
auto_approve_workspace = true

[defaults]
model = "chatgpt/gpt-5.6-luna"

[providers.hoshikage]
codex_id = "hoshikage"
enabled = true
max_concurrent_turns = 1
base_url = "http://127.0.0.1:3030/v1"
# Models are discovered from Hoshikage when /v1/models or a request needs a catalog.
# Static model entries are optional.
# If Hoshikage is stopped or unavailable, discovery gives up after 5 seconds
# and the Proxy continues without Hoshikage's dynamic models.

# Optional ChatGPT provider. Authentication is supplied through the user's
# Codex auth.json in the generated CODEX_HOME; the Proxy does not create it.
# Prepare it with:
# CODEX_HOME="$HOME/.config/codex-hoshikage-proxy/codex-home" codex login --device-auth
[providers.chatgpt]
codex_id = "openai"
enabled = true
max_concurrent_turns = 4
# ChatGPT models are discovered from Codex App Server after authentication.
# The default model above uses low reasoning when Codex advertises it.

# Optional Ollama provider.
# [providers.ollama]
# codex_id = "ollama"
# enabled = true
# max_concurrent_turns = 1
# Codex's built-in Ollama provider uses its standard local endpoint.
# Ollama models are discovered from the Ollama catalog.
# If Ollama is stopped or unavailable, discovery gives up after 5 seconds
# and the Proxy continues without Ollama's dynamic models.
