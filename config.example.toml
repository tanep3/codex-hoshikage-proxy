# Install as $HOME/.config/codex-hoshikage-proxy/config.toml.
# CODEX_HOSHIKAGE_PROXY_CONFIG may override that path when needed.

[server]
host = "127.0.0.1"
port = 4040
default_cwd = "${HOME}/work"

[codex]
command = "codex"
args = ["app-server", "--listen", "stdio://"]

[codex.compatibility]
minimum_version = "0.147.0"
tested_version = "0.147.0"

[security]
allowed_cwds = [
    "${HOME}/work",
    "${HOME}/projects",
]

[approval]
# Approval timeout in seconds. Use a short value only for testing.
timeout_seconds = 300

[defaults]
model = "chatgpt/gpt-5.6-luna"

[providers.hoshikage]
codex_id = "hoshikage"
enabled = true
max_concurrent_turns = 1
base_url = "http://127.0.0.1:3030/v1"
# Models are discovered from Hoshikage at startup. Static model entries are optional.

# Optional ChatGPT provider. Authentication is supplied through the user's
# Codex auth.json in the generated CODEX_HOME; the Proxy does not create it.
# Prepare it with:
# CODEX_HOME="$HOME/.config/codex-hoshikage-proxy/codex-home" codex login --device-auth
[providers.chatgpt]
codex_id = "openai"
enabled = true
max_concurrent_turns = 4
# ChatGPT models are discovered from Codex App Server after authentication.
# The default model above uses low reasoning when Codex advertises it.

# Optional Ollama provider.
# [providers.ollama]
# codex_id = "ollama"
# enabled = true
# max_concurrent_turns = 1
# Codex's built-in Ollama provider uses its standard local endpoint.
# Ollama models are discovered from the Ollama catalog.
