# Install as $HOME/.config/codex-hoshikage-proxy/config.toml.
# CODEX_HOSHIKAGE_PROXY_CONFIG may override that path when needed.

[server]
host = "127.0.0.1"
port = 4040
default_cwd = "${HOME}/work"

[codex]
command = "codex"
args = ["app-server", "--listen", "stdio://"]

[codex.compatibility]
minimum_version = "0.147.0"
tested_version = "0.147.0"

[security]
allowed_cwds = [
    "${HOME}/work",
    "${HOME}/projects",
]

[defaults]
model = "hoshikage/unsloth-gemma4-12b-qat-thinking-off"

[providers.hoshikage]
codex_id = "hoshikage"
enabled = true
max_concurrent_turns = 1
base_url = "http://127.0.0.1:3030/v1"
# For a non-loopback Hoshikage endpoint, set auth_env_key to your token environment variable.

[models."hoshikage/unsloth-gemma4-12b-qat-thinking-off"]
provider = "hoshikage"
upstream_model = "unsloth-gemma4-12b-qat-thinking-off"
display_name = "Unsloth Gemma 4 12B (thinking off)"
reasoning_efforts = []
